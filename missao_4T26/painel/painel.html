:root{
  /* LDS: primary #78DE1F · primary-foreground #003418 · secondary #018444 · background #F2F2F2 · foreground #4A4A4A
     muted-foreground #6E6E6E · border #E6E6E6 · destructive #D92020 (#720D0D, #FFE4E4, #FFD1D1) · badge #CEFDAF/#D1F5DC
     alert #0B4260/#D8EFFD/#C0E6FC · texto #262626 · borda de campo #919191 */
  --page:#F2F2F2; --surface:#FFFFFF; --ink:#262626; --ink2:#4A4A4A; --muted:#6E6E6E; --grid:#E6E6E6; --axis:#919191; --line:#E6E6E6;
  --verde:#78DE1F; --verde-esc:#018444; --verde-noite:#003418; --verde-claro:#D1F5DC; --verde-badge:#CEFDAF;
  --vermelho:#D92020; --vermelho-esc:#720D0D; --vermelho-claro:#FFE4E4;
  --info:#0B4260; --info-claro:#D8EFFD; --info-borda:#C0E6FC;
  --font:"Inter Variable",Inter,"Segoe UI","Liberation Sans",Arial,Helvetica,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E6E6E6;font-family:var(--font);color:var(--ink)}
#wrap{width:1280px;margin:0 auto}
.canvas{position:relative;width:1280px;height:720px;background:var(--page);overflow:hidden;font-size:12px;line-height:1.3}
/* painel esquerdo */
.rail{position:absolute;left:0;top:0;bottom:0;width:168px;background:var(--verde-noite);color:#fff;padding:12px 12px;display:flex;flex-direction:column;gap:4px}
.rail .brand{font-size:13px;font-weight:650;line-height:1.25}
.rail .brand small{display:block;font-weight:400;color:var(--verde);font-size:11px;margin-top:2px}
.rail button.navb{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:rgba(255,255,255,.86);font-size:12px;white-space:nowrap}
.rail button.navb i{display:inline-flex;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);font-style:normal;font-size:10px;align-items:center;justify-content:center;flex:none}
.rail button.navb:hover{background:rgba(255,255,255,.08)}
.rail button.navb:focus-visible{outline:2px solid var(--verde)}
.rail button.navb.on{background:var(--verde);color:var(--verde-noite);font-weight:600} .rail button.navb.on i{background:var(--verde-noite);color:var(--verde)}
.rail h6{margin:9px 0 2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--verde);font-weight:600}
.rail label{font-size:10px;color:rgba(255,255,255,.66);display:block;margin-top:2px}
.rail select,.rail input{width:100%;font:inherit;font-size:11px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.24);border-radius:5px;padding:3px 6px;color-scheme:dark}
.rail .dt{display:grid;grid-template-columns:1fr;gap:3px}
.rail .limpar{all:unset;cursor:pointer;font-size:10.5px;color:var(--verde);margin-top:4px}

<body>
<div id="wrap"></div>
<script src="dados.js"></script>
<script>
"use strict";
/* ===================================================================================================================
   Painel de carga operacional (MVP). Lê window.PAINEL_DADOS (dados.js, gerado por atualizar_painel.py) e calcula tudo
   no navegador conforme os filtros. Mesmas regras de missao_4T26/bi/ (K1 = carga operacional completa sobre a base
   classificada pelo GPT com duração).
   =================================================================================================================== */
const wrap = document.getElementById('wrap');
const D = window.PAINEL_DADOS;
if (!D) {
  wrap.innerHTML = `<div class="erro"><h1>Não encontrei os dados do painel</h1>
  <p>O arquivo <code>dados.js</code> não está na mesma pasta deste <code>painel.html</code>, ou ainda não terminou de sincronizar.</p>
  <ol><li>Abra a pasta do painel no Explorador de Arquivos e veja se <code>dados.js</code> está lá.</li>
  <li>Se o ícone do arquivo for uma nuvem, clique com o botão direito na pasta → <b>Sempre manter neste dispositivo</b>.</li>
  <li>Se o arquivo não existir, avise o responsável pela atualização diária.</li></ol></div>`;
  throw new Error('dados.js ausente');
}

/* ---------------- formatos ---------------- */
const nf=(x,d=0)=>x==null||!isFinite(x)?'–':Number(x).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(x,d=1)=>x==null||!isFinite(x)?'–':nf(x*100,d)+'%';
const pp=(x,d=1)=>x==null||!isFinite(x)?'–':(x>=0?'+':'−')+nf(Math.abs(x),d)+' p.p.';
const dd=s=>s.slice(8,10)+'/'+s.slice(5,7);
const ddmmaa=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'–';
const DOWN=['dom','seg','ter','qua','qui','sex','sáb'];
const dw=s=>DOWN[new Date(s+'T12:00:00').getDay()];
const mmss=s=>s==null||!isFinite(s)?'–':Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
/* bom/negociação = verdes LDS · carga operacional/problema = vermelho LDS (orange2 = #D92020 a 50% sobre branco) · neutros LDS */
const C={blue:'#018444',blue2:'#78DE1F',orange:'#D92020',orange2:'#EC9090',gray:'#6E6E6E',ink:'#262626',ink2:'#4A4A4A',grid:'#E6E6E6',axis:'#919191',dark:'#4A4A4A',light:'#919191',noite:'#003418'};
const IC={
 warn:'<svg class="ico" viewBox="0 0 18 18"><path d="M9 1.8 17 16H1Z" fill="#FFE4E4" stroke="#D92020" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7v4M9 13.2v.1" stroke="#720D0D" stroke-width="1.6" stroke-linecap="round"/></svg>',
 crit:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#D92020" stroke="#720D0D" stroke-width="1.5"/><path d="M9 4.8v5M9 12.5v.1" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>',
 ok:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#D1F5DC" stroke="#018444" stroke-width="1.5"/><path d="M5.3 9.3l2.4 2.4 5-5.2" fill="none" stroke="#003418" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 info:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#D8EFFD" stroke="#0B4260" stroke-width="1.5"/><path d="M9 8v5M9 5.2v.1" stroke="#0B4260" stroke-width="1.7" stroke-linecap="round"/></svg>'};

/* ---------------- gráficos (SVG em texto, tamanho fixo) ---------------- */
function niceMax(v,steps){if(!(v>0))return steps;const raw=v/steps;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p*steps}
function grid(w,h,m,ymax,ticks,fmt,ymin=0){let o='';for(let k=0;k<=ticks;k++){const v=ymin+(ymax-ymin)*k/ticks,y=m.t+(h-m.t-m.b)-(v-ymin)/(ymax-ymin)*(h-m.t-m.b);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${k===0?C.axis:C.grid}"/><text x="${m.l-6}" y="${y+3.5}" text-anchor="end">${fmt(v)}</text>`}return o}
function lineSVG({w,h,labels,series,yMax,yMin=0,ticks=4,fmt=v=>pc(v,0),refs=[],every=1,notes=[]}){
  const m={l:38,r:refs.length?78:12,t:8,b:22},iw=w-m.l-m.r,ih=h-m.t-m.b,n=labels.length;
  const X=i=>m.l+(n===1?iw/2:i*iw/(n-1)),Y=v=>m.t+ih-(v-yMin)/(yMax-yMin)*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt,yMin);
  labels.forEach((t,i)=>{if(i===n-1||i%every===0&&n-1-i>=Math.max(1,every*.6))o+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${t}</text>`});
  refs.forEach(r=>{const y=Y(r.y);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="1.4" stroke-dasharray="${r.dash||'5 4'}"/><text x="${w-m.r+4}" y="${y+3.5}" style="fill:${r.color};font-weight:600">${r.label}</text>`});
  series.forEach(s=>{let d='',open=false,last=null;s.data.forEach((v,i)=>{if(v==null||!isFinite(v)){open=false;return}d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);open=true;last=i});
    o+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    if(n<=31)s.data.forEach((v,i)=>{if(v!=null&&isFinite(v)&&s.dots)o+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.4" fill="${s.color}"/>`});
    if(last!=null&&s.endLabel)o+=`<circle cx="${X(last)}" cy="${Y(s.data[last])}" r="3.6" fill="${s.color}" stroke="#fff" stroke-width="1.5"/><text x="${X(last)-2}" y="${Y(s.data[last])-8}" text-anchor="end" class="k bold">${s.endLabel}</text>`});
  notes.forEach(nt=>{if(nt.i<0)return;const x=X(nt.i);o+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ih}" stroke="${C.gray}" stroke-dasharray="2 3"/><text x="${nt.end?x-4:x+4}" y="${m.t+(nt.dy||10)}" text-anchor="${nt.end?'end':'start'}" style="fill:${C.ink2}">${nt.text}</text>`});
  return o+'</svg>'}
function colsSVG({w,h,items,yMax,ticks=4,fmt=v=>pc(v,0),lab=v=>pc(v,1),whisker=false,m0}){
  const m=m0||{l:38,r:8,t:16,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/Math.max(1,items.length),bw=Math.min(40,band*.58),Y=v=>m.t+ih-Math.min(v,yMax)/yMax*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt);
  items.forEach((it,i)=>{const cx=m.l+band*(i+.5);o+=`<text x="${cx}" y="${h-7}" text-anchor="middle">${it.label}</text>`;if(it.v==null||!isFinite(it.v))return;const y=Y(it.v),x=cx-bw/2,r=Math.min(3,bw/2);
    if(Y(0)-y>.5)o+=`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${it.color||C.blue}"/>`;
    if(whisker&&it.lo!=null){const a=Y(it.lo),b=Y(it.hi);o+=`<line x1="${cx}" x2="${cx}" y1="${a}" y2="${b}" stroke="${C.ink}" stroke-width="1.4"/><line x1="${cx-4}" x2="${cx+4}" y1="${a}" y2="${a}" stroke="${C.ink}" stroke-width="1.4"/><line x1="${cx-4}" x2="${cx+4}" y1="${b}" y2="${b}" stroke="${C.ink}" stroke-width="1.4"/>`}
    o+=`<text x="${cx}" y="${(whisker&&it.hi!=null?Y(it.hi):y)-5}" text-anchor="middle" class="k bold">${lab(it.v,it)}</text>`});
  return o+'</svg>'}
function groupSVG({w,h,groups,yMax,ticks=4,fmt=v=>pc(v,0),lab=v=>pc(v,0),refs=[]}){
  const m={l:38,r:refs.length?78:8,t:16,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/Math.max(1,groups.length),Y=v=>m.t+ih-Math.min(v,yMax)/yMax*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt);
  groups.forEach((g,i)=>{const nn=g.vals.length,bw=Math.min(30,band*.72/nn),gap=2,tw=nn*bw+(nn-1)*gap,x0=m.l+band*(i+.5)-tw/2;
    g.vals.forEach((it,j)=>{if(it.v==null||!isFinite(it.v))return;const x=x0+j*(bw+gap),y=Y(it.v),r=Math.min(3,bw/2);
      o+=`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${it.color}"/><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" class="k" style="font-size:9.5px">${lab(it.v)}</text>`});
    o+=`<text x="${m.l+band*(i+.5)}" y="${h-7}" text-anchor="middle">${g.label}</text>`});
  refs.forEach(r=>{const y=Y(r.y);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${w-m.r+4}" y="${y+3.5}" style="fill:${r.color};font-weight:600">${r.label}</text>`});
  return o+'</svg>'}
function hbarsSVG({w,h,items,max,fmt=v=>pc(v,1),labelW=96,median,rowGap=.28,valW=48,rowH,onClick}){
  const pt=median?14:0,rh=rowH||((h-pt)/Math.max(1,items.length)),H=rowH?items.length*rowH+pt:h,bh=Math.max(5,rh*(1-rowGap)),iw=w-labelW-valW;
  let o=`<svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}">`;const mx=max||Math.max(...items.map(i=>i.v||0),1e-9);
  if(median!=null){const x=labelW+median.v/mx*iw;o+=`<line x1="${x}" x2="${x}" y1="9" y2="${H}" stroke="${C.ink}" stroke-width="1.3" stroke-dasharray="4 3"/><text x="${x}" y="7" text-anchor="middle" class="k bold" style="font-size:9.5px">${median.label}</text>`}
  items.forEach((it,i)=>{const y=pt+i*rh+(rh-bh)/2,bw=Math.max(1,(it.v||0)/mx*iw);
    o+=`<g ${onClick&&it.key?`data-cart="${esc(it.key)}" style="cursor:pointer"`:''}><rect x="0" y="${pt+i*rh}" width="${w}" height="${rh}" fill="${it.sel?'#D1F5DC':'transparent'}"/><text x="${labelW-6}" y="${y+bh/2+3.5}" text-anchor="end" class="${it.sel?'k bold':''}">${esc(it.label)}</text><rect x="${labelW}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="${it.color||C.blue}"/><text x="${labelW+bw+5}" y="${y+bh/2+3.5}" class="k" style="font-size:${rh<14?9:10}px">${it.lab||fmt(it.v)}</text></g>`});
  return o+'</svg>'}
function stackSVG({w,h,parts,fmt=v=>pc(v,1)}){const tot=parts.reduce((a,p)=>a+(p.v||0),0);if(!(tot>0))return '';let x=0,o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  parts.forEach(p=>{const pw=(p.v||0)/tot*w,bw=Math.max(0,pw-2);if(pw<=0)return;o+=`<rect x="${x}" y="0" width="${bw}" height="${h}" rx="3" fill="${p.color}"/>`;
    if(bw>46)o+=`<text x="${x+7}" y="${h/2+4}" style="fill:${p.text||'#fff'};font-weight:600;font-size:11px">${p.lab||fmt(p.v/tot)}</text>`;x+=pw});return o+'</svg>'}
function gaugeSVG({w,h,value,min,max,target,baseline,fmtv}){
  const cx=w/2,cy=h-34,r=Math.min(w/2-34,h-70),th=24,cl=v=>Math.max(min,Math.min(max,v)),ang=v=>Math.PI-(cl(v)-min)/(max-min)*Math.PI,pt=(v,rr)=>[cx+rr*Math.cos(ang(v)),cy-rr*Math.sin(ang(v))];
  const arc=(v0,v1,rr)=>{const a=pt(v0,rr),b=pt(v1,rr);return `M${a[0]} ${a[1]}A${rr} ${rr} 0 0 1 ${b[0]} ${b[1]}`};
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${arc(min,max,r)}" fill="none" stroke="#E6E6E6" stroke-width="${th}"/>`;
  if(value!=null)o+=`<path d="${arc(min,value,r)}" fill="none" stroke="${C.orange}" stroke-width="${th}"/>`;
  [[target,C.blue,'Meta'],[baseline,C.dark,'Baseline']].forEach(([v,c,t])=>{const a=pt(v,r-th/2-4),b=pt(v,r+th/2+6),l=pt(v,r+th/2+18);o+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="2.4"/><text x="${l[0]}" y="${l[1]+3}" text-anchor="${t==='Meta'?'end':'start'}" style="fill:${c};font-weight:600;font-size:10.5px">${t} ${fmtv(v)}</text>`});
  o+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" style="font-size:36px;font-weight:650;fill:${C.ink}">${fmtv(value)}</text><text x="${cx-r}" y="${cy+18}" text-anchor="middle">${fmtv(min)}</text><text x="${cx+r}" y="${cy+18}" text-anchor="middle">${fmtv(max)}</text>`;
  return o+'</svg>'}
function comboSVG({w,h,items,yMax,y2Max=1}){
  const m={l:38,r:40,t:16,b:30},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/Math.max(1,items.length),bw=Math.min(38,band*.6),Y=v=>m.t+ih-v/yMax*ih,Y2=v=>m.t+ih-v/y2Max*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,4,v=>nf(v,yMax<4?1:0));
  for(let k=0;k<=4;k++)o+=`<text x="${w-m.r+6}" y="${Y2(y2Max*k/4)+3.5}">${pc(k/4*y2Max,0)}</text>`;
  let d='';items.forEach((it,i)=>{const cx=m.l+band*(i+.5),y=Y(it.v),x=cx-bw/2,r=3;

});
wrap.addEventListener('change',ev=>{
  const id=ev.target.id,v=ev.target.value;
  if(id==='fPreset'){S.preset=v;if(v!=='pers')aplicaPreset(v)}
  else if(id==='fD0'||id==='fD1'){const i=idxDia(v||DIAS[0]);if(id==='fD0')S.d0=i;else S.d1=Math.max(0,DIAS[i]>v&&i>0?i-1:i);if(S.d1<S.d0)[S.d0,S.d1]=[S.d1,S.d0];S.preset='pers'}
  else if(id==='fDist'){S.dist=v;if(S.cart&&CART.find(x=>x.c===S.cart).d!==v&&v)S.cart=''}
  else if(id==='fCart'){S.cart=v}
  else return;
  render();
});
document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT'||ev.target.tagName==='SELECT')return;const n=parseInt(ev.key,10);if(n>=1&&n<=8){S.page=n;render()}});
/* para conferência automatizada (testes): métricas do filtro atual */
window.__painel={S,render,M,soma,filtra,D};
render();
</script>
</body>
