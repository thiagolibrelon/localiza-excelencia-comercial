<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel · Carga operacional da venda interna (DVINT)</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --line:#e1e0d9;
  --blue:#2a78d6; --blue2:#8fb4e8; --orange:#eb6834; --orange2:#f5b296;
  --font:"Segoe UI","Liberation Sans",Arial,Helvetica,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e8e2;font-family:var(--font);color:var(--ink)}
#wrap{width:1280px;margin:0 auto}
.canvas{position:relative;width:1280px;height:720px;background:var(--page);overflow:hidden;font-size:12px;line-height:1.3}
/* painel esquerdo */
.rail{position:absolute;left:0;top:0;bottom:0;width:168px;background:#12202e;color:#e8edf3;padding:12px 12px;display:flex;flex-direction:column;gap:4px}
.rail .brand{font-size:13px;font-weight:650;line-height:1.25}
.rail .brand small{display:block;font-weight:400;color:#9fb0c2;font-size:11px;margin-top:2px}
.rail button.navb{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:#c9d5e2;font-size:12px;white-space:nowrap}
.rail button.navb i{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#26394d;color:#9fb0c2;font-style:normal;font-size:10px;align-items:center;justify-content:center;flex:none}
.rail button.navb:hover{background:#1b2f43}
.rail button.navb:focus-visible{outline:2px solid #8fb4e8}
.rail button.navb.on{background:#2a78d6;color:#fff;font-weight:600} .rail button.navb.on i{background:#fff;color:#2a78d6}
.rail h6{margin:9px 0 2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7f93a8;font-weight:600}
.rail label{font-size:10px;color:#8aa0b6;display:block;margin-top:2px}
.rail select,.rail input{width:100%;font:inherit;font-size:11px;color:#dfe8f1;background:#1b2f43;border:1px solid #2c445c;border-radius:5px;padding:3px 6px;color-scheme:dark}
.rail .dt{display:grid;grid-template-columns:1fr;gap:3px}
.rail .limpar{all:unset;cursor:pointer;font-size:10.5px;color:#8fb4e8;margin-top:4px}
.rail .stat{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.chipx{font-size:10px;border-radius:4px;padding:3px 6px;line-height:1.3}
.chipx.a{background:#3a2a14;color:#ffd48a;border:1px solid #6b4d1c}
.chipx.b{background:#1b2f43;color:#c9d5e2;border:1px solid #2c445c}
/* área principal */
.hd{position:absolute;left:182px;top:12px;width:1084px;height:40px;display:flex;justify-content:space-between;align-items:flex-start}
.hd h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
.hd h2 span{color:var(--muted);font-weight:500}
.hd .rt{font-size:11px;color:var(--ink2);text-align:right;padding-top:4px}
.main{position:absolute;left:182px;top:58px;width:1084px;height:648px}
.foot{position:absolute;left:182px;right:14px;bottom:3px;display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted)}
.v{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.v .t{position:absolute;left:12px;top:9px;right:12px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v .s{position:absolute;left:12px;top:26px;right:12px;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v .b{position:absolute;left:12px;right:12px;bottom:8px}
.v.v11{border:1.5px dashed #c58a2b}
.v .tag11{position:absolute;right:8px;top:7px;background:#fff1cc;color:#7a4e00;border:1px solid #e8c766;border-radius:4px;font-size:9.5px;font-weight:600;padding:1px 6px;z-index:2}
.kpi .lab{position:absolute;left:12px;top:9px;right:10px;font-size:11.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{position:absolute;left:12px;top:26px;font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi .sub{position:absolute;left:12px;right:10px;bottom:20px;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub2{position:absolute;left:12px;right:10px;bottom:6px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:#c4481a} .dn{color:#1f62b8}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:10.5px;color:var(--ink2);margin-bottom:2px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.sq{height:9px;width:9px;border-radius:2px;vertical-align:-1px}
svg{display:block;overflow:visible} svg text{font-family:var(--font);font-size:10px;fill:var(--ink2)} svg .k{fill:var(--ink)} svg .bold{font-weight:600}
table.tb{border-collapse:collapse;width:100%;font-size:11px}
table.tb th{font-weight:600;color:var(--ink2);text-align:right;padding:3px 6px;border-bottom:1px solid var(--axis);font-size:10.5px;white-space:nowrap;background:var(--surface);position:sticky;top:0}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:2.5px 6px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tb tr:last-child td{border-bottom:0}
table.tb tr.clic{cursor:pointer} table.tb tr.clic:hover td{background:#f1f0ea}
table.tb tr.sel td{background:#e3eefb}
.dbar{position:relative;display:inline-block;min-width:92px;height:15px;text-align:right;vertical-align:middle}
.dbar i{position:absolute;left:0;top:1px;bottom:1px;border-radius:2px;opacity:.28}
.dbar span{position:relative;padding-right:3px}
.ico{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.al{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--grid)}
.al:last-child{border-bottom:0}
.al b{font-size:11.5px;display:block}
.al div{font-size:10.5px;color:var(--ink2);line-height:1.35}
.al .m{color:var(--muted);font-size:9.5px;margin-top:2px}
.note{font-size:11px;color:var(--ink2);line-height:1.45}
.note b{color:var(--ink)}
.pill{display:inline-block;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:600}
.pill.ok{background:#e3eefb;color:#1f62b8}.pill.at{background:#fdebd0;color:#8a540a}.pill.cr{background:#fbe0d3;color:#b23d12}.pill.in{background:#eceae3;color:#6b6a65}
.seg{display:flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden;font-size:11px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:5px 0;border-right:1px solid var(--axis);color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.vazio{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12px;text-align:center;padding:10px}
.scroll{overflow:auto}
.erro{max-width:640px;margin:80px auto;background:#fff;border:1px solid #e1e0d9;border-radius:10px;padding:24px 28px;font-size:14px;line-height:1.5}
.erro h1{font-size:18px;margin:0 0 10px}
.erro code{background:#f1f0ea;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div id="wrap"></div>
<script src="dados.js"></script>
<script>
"use strict";
/* ===================================================================================================================
   Painel de carga operacional (MVP). Lê window.PAINEL_DADOS (dados.js, gerado por atualizar_painel.py) e calcula tudo
   no navegador conforme os filtros. Mesmas regras de missao_4T26/bi/ (K1 = carga operacional completa sobre a base
   classificada pelo GPT com duração).
   =================================================================================================================== */
const wrap = document.getElementById('wrap');
const D = window.PAINEL_DADOS;
if (!D) {
  wrap.innerHTML = `<div class="erro"><h1>Não encontrei os dados do painel</h1>
  <p>O arquivo <code>dados.js</code> não está na mesma pasta deste <code>painel.html</code>, ou ainda não terminou de sincronizar.</p>
  <ol><li>Abra a pasta do painel no Explorador de Arquivos e veja se <code>dados.js</code> está lá.</li>
  <li>Se o ícone do arquivo for uma nuvem, clique com o botão direito na pasta → <b>Sempre manter neste dispositivo</b>.</li>
  <li>Se o arquivo não existir, avise o responsável pela atualização diária.</li></ol></div>`;
  throw new Error('dados.js ausente');
}

/* ---------------- formatos ---------------- */
const nf=(x,d=0)=>x==null||!isFinite(x)?'–':Number(x).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(x,d=1)=>x==null||!isFinite(x)?'–':nf(x*100,d)+'%';
const pp=(x,d=1)=>x==null||!isFinite(x)?'–':(x>=0?'+':'−')+nf(Math.abs(x),d)+' p.p.';
const dd=s=>s.slice(8,10)+'/'+s.slice(5,7);
const ddmmaa=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'–';
const DOWN=['dom','seg','ter','qua','qui','sex','sáb'];
const dw=s=>DOWN[new Date(s+'T12:00:00').getDay()];
const mmss=s=>s==null||!isFinite(s)?'–':Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const C={blue:'#2a78d6',blue2:'#8fb4e8',orange:'#eb6834',orange2:'#f5b296',gray:'#898781',ink:'#0b0b0b',ink2:'#52514e',grid:'#e1e0d9',axis:'#c3c2b7',dark:'#52514e',light:'#b8b6ac'};
const IC={
 warn:'<svg class="ico" viewBox="0 0 18 18"><path d="M9 1.8 17 16H1Z" fill="#fdebd0" stroke="#d08a1e" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7v4M9 13.2v.1" stroke="#a8650d" stroke-width="1.6" stroke-linecap="round"/></svg>',
 crit:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#fbe0d3" stroke="#d95926" stroke-width="1.5"/><path d="M9 4.8v5M9 12.5v.1" stroke="#b23d12" stroke-width="1.7" stroke-linecap="round"/></svg>',
 ok:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><path d="M5.3 9.3l2.4 2.4 5-5.2" fill="none" stroke="#1f62b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 info:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#eceae3" stroke="#898781" stroke-width="1.5"/><path d="M9 8v5M9 5.2v.1" stroke="#6b6a65" stroke-width="1.7" stroke-linecap="round"/></svg>'};

/* ---------------- gráficos (SVG em texto, tamanho fixo) ---------------- */
function niceMax(v,steps){if(!(v>0))return steps;const raw=v/steps;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p*steps}
function grid(w,h,m,ymax,ticks,fmt,ymin=0){let o='';for(let k=0;k<=ticks;k++){const v=ymin+(ymax-ymin)*k/ticks,y=m.t+(h-m.t-m.b)-(v-ymin)/(ymax-ymin)*(h-m.t-m.b);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${k===0?C.axis:C.grid}"/><text x="${m.l-6}" y="${y+3.5}" text-anchor="end">${fmt(v)}</text>`}return o}
function lineSVG({w,h,labels,series,yMax,yMin=0,ticks=4,fmt=v=>pc(v,0),refs=[],every=1,notes=[]}){
  const m={l:38,r:refs.length?78:12,t:8,b:22},iw=w-m.l-m.r,ih=h-m.t-m.b,n=labels.length;
  const X=i=>m.l+(n===1?iw/2:i*iw/(n-1)),Y=v=>m.t+ih-(v-yMin)/(yMax-yMin)*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt,yMin);
  labels.forEach((t,i)=>{if(i===n-1||i%every===0&&n-1-i>=Math.max(1,every*.6))o+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${t}</text>`});
  refs.forEach(r=>{const y=Y(r.y);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="1.4" stroke-dasharray="${r.dash||'5 4'}"/><text x="${w-m.r+4}" y="${y+3.5}" style="fill:${r.color};font-weight:600">${r.label}</text>`});
  series.forEach(s=>{let d='',open=false,last=null;s.data.forEach((v,i)=>{if(v==null||!isFinite(v)){open=false;return}d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);open=true;last=i});
    o+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    if(n<=31)s.data.forEach((v,i)=>{if(v!=null&&isFinite(v)&&s.dots)o+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.4" fill="${s.color}"/>`});
    if(last!=null&&s.endLabel)o+=`<circle cx="${X(last)}" cy="${Y(s.data[last])}" r="3.6" fill="${s.color}" stroke="#fff" stroke-width="1.5"/><text x="${X(last)-2}" y="${Y(s.data[last])-8}" text-anchor="end" class="k bold">${s.endLabel}</text>`});
  notes.forEach(nt=>{if(nt.i<0)return;const x=X(nt.i);o+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ih}" stroke="${C.gray}" stroke-dasharray="2 3"/><text x="${nt.end?x-4:x+4}" y="${m.t+(nt.dy||10)}" text-anchor="${nt.end?'end':'start'}" style="fill:${C.ink2}">${nt.text}</text>`});
  return o+'</svg>'}
function colsSVG({w,h,items,yMax,ticks=4,fmt=v=>pc(v,0),lab=v=>pc(v,1),whisker=false,m0}){
  const m=m0||{l:38,r:8,t:16,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/Math.max(1,items.length),bw=Math.min(40,band*.58),Y=v=>m.t+ih-Math.min(v,yMax)/yMax*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt);
  items.forEach((it,i)=>{const cx=m.l+band*(i+.5);o+=`<text x="${cx}" y="${h-7}" text-anchor="middle">${it.label}</text>`;if(it.v==null||!isFinite(it.v))return;const y=Y(it.v),x=cx-bw/2,r=Math.min(3,bw/2);
    if(Y(0)-y>.5)o+=`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${it.color||C.blue}"/>`;
    if(whisker&&it.lo!=null){const a=Y(it.lo),b=Y(it.hi);o+=`<line x1="${cx}" x2="${cx}" y1="${a}" y2="${b}" stroke="${C.ink}" stroke-width="1.4"/><line x1="${cx-4}" x2="${cx+4}" y1="${a}" y2="${a}" stroke="${C.ink}" stroke-width="1.4"/><line x1="${cx-4}" x2="${cx+4}" y1="${b}" y2="${b}" stroke="${C.ink}" stroke-width="1.4"/>`}
    o+=`<text x="${cx}" y="${(whisker&&it.hi!=null?Y(it.hi):y)-5}" text-anchor="middle" class="k bold">${lab(it.v,it)}</text>`});
  return o+'</svg>'}
function groupSVG({w,h,groups,yMax,ticks=4,fmt=v=>pc(v,0),lab=v=>pc(v,0),refs=[]}){
  const m={l:38,r:refs.length?78:8,t:16,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/Math.max(1,groups.length),Y=v=>m.t+ih-Math.min(v,yMax)/yMax*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt);
  groups.forEach((g,i)=>{const nn=g.vals.length,bw=Math.min(30,band*.72/nn),gap=2,tw=nn*bw+(nn-1)*gap,x0=m.l+band*(i+.5)-tw/2;
    g.vals.forEach((it,j)=>{if(it.v==null||!isFinite(it.v))return;const x=x0+j*(bw+gap),y=Y(it.v),r=Math.min(3,bw/2);
      o+=`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${it.color}"/><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" class="k" style="font-size:9.5px">${lab(it.v)}</text>`});
    o+=`<text x="${m.l+band*(i+.5)}" y="${h-7}" text-anchor="middle">${g.label}</text>`});
  refs.forEach(r=>{const y=Y(r.y);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${w-m.r+4}" y="${y+3.5}" style="fill:${r.color};font-weight:600">${r.label}</text>`});
  return o+'</svg>'}
function hbarsSVG({w,h,items,max,fmt=v=>pc(v,1),labelW=96,median,rowGap=.28,valW=48,rowH,onClick}){
  const pt=median?14:0,rh=rowH||((h-pt)/Math.max(1,items.length)),H=rowH?items.length*rowH+pt:h,bh=Math.max(5,rh*(1-rowGap)),iw=w-labelW-valW;
  let o=`<svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}">`;const mx=max||Math.max(...items.map(i=>i.v||0),1e-9);
  if(median!=null){const x=labelW+median.v/mx*iw;o+=`<line x1="${x}" x2="${x}" y1="9" y2="${H}" stroke="${C.ink}" stroke-width="1.3" stroke-dasharray="4 3"/><text x="${x}" y="7" text-anchor="middle" class="k bold" style="font-size:9.5px">${median.label}</text>`}
  items.forEach((it,i)=>{const y=pt+i*rh+(rh-bh)/2,bw=Math.max(1,(it.v||0)/mx*iw);
    o+=`<g ${onClick&&it.key?`data-cart="${esc(it.key)}" style="cursor:pointer"`:''}><rect x="0" y="${pt+i*rh}" width="${w}" height="${rh}" fill="${it.sel?'#e3eefb':'transparent'}"/><text x="${labelW-6}" y="${y+bh/2+3.5}" text-anchor="end" class="${it.sel?'k bold':''}">${esc(it.label)}</text><rect x="${labelW}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="${it.color||C.blue}"/><text x="${labelW+bw+5}" y="${y+bh/2+3.5}" class="k" style="font-size:${rh<14?9:10}px">${it.lab||fmt(it.v)}</text></g>`});
  return o+'</svg>'}
function stackSVG({w,h,parts,fmt=v=>pc(v,1)}){const tot=parts.reduce((a,p)=>a+(p.v||0),0);if(!(tot>0))return '';let x=0,o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  parts.forEach(p=>{const pw=(p.v||0)/tot*w,bw=Math.max(0,pw-2);if(pw<=0)return;o+=`<rect x="${x}" y="0" width="${bw}" height="${h}" rx="3" fill="${p.color}"/>`;
    if(bw>46)o+=`<text x="${x+7}" y="${h/2+4}" style="fill:${p.text||'#fff'};font-weight:600;font-size:11px">${p.lab||fmt(p.v/tot)}</text>`;x+=pw});return o+'</svg>'}
function gaugeSVG({w,h,value,min,max,target,baseline,fmtv}){
  const cx=w/2,cy=h-34,r=Math.min(w/2-34,h-70),th=24,cl=v=>Math.max(min,Math.min(max,v)),ang=v=>Math.PI-(cl(v)-min)/(max-min)*Math.PI,pt=(v,rr)=>[cx+rr*Math.cos(ang(v)),cy-rr*Math.sin(ang(v))];
  const arc=(v0,v1,rr)=>{const a=pt(v0,rr),b=pt(v1,rr);return `M${a[0]} ${a[1]}A${rr} ${rr} 0 0 1 ${b[0]} ${b[1]}`};
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${arc(min,max,r)}" fill="none" stroke="#e8e6df" stroke-width="${th}"/>`;
  if(value!=null)o+=`<path d="${arc(min,value,r)}" fill="none" stroke="${C.orange}" stroke-width="${th}"/>`;

  </div>
  <div class="hd"><div><h2>${pg[0]} · ${pg[1]} <span>— ${pg[2]}</span></h2></div><div class="rt">${esc(rt||'')}</div></div>
  <div class="main">${corpo}</div>
  <div class="foot"><span>Painel MVP · números agregados do CSV da consulta · carteira = código, sem nome de vendedor · regras do plano da missão 4T26</span><span>Atualizado em ${D.meta.gerado_em.slice(8,10)}/${D.meta.gerado_em.slice(5,7)} ${D.meta.gerado_em.slice(11)}</span></div>
  </div>`;
  salvar();ajustar();
}
function ajustar(){const s=Math.min(1,(document.documentElement.clientWidth-8)/1280,(window.innerHeight-8)/720);wrap.style.zoom=s<1?String(Math.max(.5,s)):'';}
window.addEventListener('resize',ajustar);
wrap.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-page]');if(b){S.page=+b.dataset.page;render();return}
  const c=ev.target.closest('[data-cart]');if(c){const v=c.dataset.cart;S.cart=S.cart===v?'':v;if(S.cart){const k=CART.find(x=>x.c===S.cart);if(k&&S.dist&&k.d!==S.dist)S.dist=''}render();return}
  const r=ev.target.closest('[data-red]');if(r){S.redP1=+r.dataset.red;render();return}
  const mn=ev.target.closest('[data-min]');if(mn){S.minLig=+mn.dataset.min;render();return}
  if(ev.target.closest('[data-ultimo]')){const u=idxDia(D.meta.duracao_ate);S.preset='pers';S.d1=DIAS[u]>D.meta.duracao_ate&&u>0?u-1:u;S.d0=idxDia(DIAS[S.d1].slice(0,7)+'-01');render();return}
  if(ev.target.id==='fLimpar'){S.dist='';S.cart='';S.preset='mes';aplicaPreset('mes');S.minLig=CFG.min_ligacoes;render()}
});
wrap.addEventListener('change',ev=>{
  const id=ev.target.id,v=ev.target.value;
  if(id==='fPreset'){S.preset=v;if(v!=='pers')aplicaPreset(v)}
  else if(id==='fD0'||id==='fD1'){const i=idxDia(v||DIAS[0]);if(id==='fD0')S.d0=i;else S.d1=Math.max(0,DIAS[i]>v&&i>0?i-1:i);if(S.d1<S.d0)[S.d0,S.d1]=[S.d1,S.d0];S.preset='pers'}
  else if(id==='fDist'){S.dist=v;if(S.cart&&CART.find(x=>x.c===S.cart).d!==v&&v)S.cart=''}
  else if(id==='fCart'){S.cart=v}
  else return;
  render();
});
document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT'||ev.target.tagName==='SELECT')return;const n=parseInt(ev.key,10);if(n>=1&&n<=8){S.page=n;render()}});
/* para conferência automatizada (testes): métricas do filtro atual */
window.__painel={S,render,M,soma,filtra,D};
render();
</script>
</body>
</html>
