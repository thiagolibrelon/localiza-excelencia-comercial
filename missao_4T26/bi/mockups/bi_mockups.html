<script>
/* ============ utilidades ============ */
const nf=(x,d=0)=>x==null?'–':Number(x).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(x,d=1)=>x==null?'–':nf(x*100,d)+'%';
const pp=(x,d=1)=>(x>=0?'+':'−')+nf(Math.abs(x),d)+' p.p.';
const dd=s=>s.slice(8,10)+'/'+s.slice(5,7);
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const dw=s=>DOW[new Date(s+'T12:00:00').getDay()];

const IC={
 warn:'<svg class="ico" viewBox="0 0 18 18"><path d="M9 1.8 17 16H1Z" fill="#fdebd0" stroke="#d08a1e" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7v4M9 13.2v.1" stroke="#a8650d" stroke-width="1.6" stroke-linecap="round"/></svg>',
 crit:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#fbe0d3" stroke="#d95926" stroke-width="1.5"/><path d="M9 4.8v5M9 12.5v.1" stroke="#b23d12" stroke-width="1.7" stroke-linecap="round"/></svg>',
 ok:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/><path d="M5.3 9.3l2.4 2.4 5-5.2" fill="none" stroke="#1f62b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 info:'<svg class="ico" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#eceae3" stroke="#898781" stroke-width="1.5"/><path d="M9 8v5M9 5.2v.1" stroke="#6b6a65" stroke-width="1.7" stroke-linecap="round"/></svg>'};

/* ============ gráficos (SVG em string, tamanho fixo) ============ */
function niceMax(v,steps){const raw=v/steps;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p*steps}
function grid(w,h,m,ymax,ticks,fmt,ymin=0){let o='';for(let k=0;k<=ticks;k++){const v=ymin+(ymax-ymin)*k/ticks,y=m.t+(h-m.t-m.b)-(v-ymin)/(ymax-ymin)*(h-m.t-m.b);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${k===0?C.axis:C.grid}"/><text x="${m.l-6}" y="${y+3.5}" text-anchor="end">${fmt(v)}</text>`}return o}
function lineSVG({w,h,labels,series,yMax,yMin=0,ticks=4,fmt=v=>pc(v,0),refs=[],every=1,markers=false,notes=[]}){
  const m={l:38,r:refs.length?78:12,t:8,b:22},iw=w-m.l-m.r,ih=h-m.t-m.b,n=labels.length;
  const X=i=>m.l+(n===1?iw/2:i*iw/(n-1)),Y=v=>m.t+ih-(v-yMin)/(yMax-yMin)*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt,yMin);
  labels.forEach((t,i)=>{if(i%every===0)o+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${t}</text>`});
  refs.forEach(r=>{const y=Y(r.y);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="1.4" stroke-dasharray="${r.dash||'5 4'}"/><text x="${w-m.r+4}" y="${y+3.5}" style="fill:${r.color};font-weight:600">${r.label}</text>`});
  series.forEach(s=>{let d='',open=false,last=null;s.data.forEach((v,i)=>{if(v==null){open=false;return}d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);open=true;last=i});
    o+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    if(markers)s.data.forEach((v,i)=>{if(v!=null)o+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.color}"/>`});
    if(last!=null&&s.endLabel)o+=`<circle cx="${X(last)}" cy="${Y(s.data[last])}" r="3.6" fill="${s.color}" stroke="#fff" stroke-width="1.5"/><text x="${X(last)-2}" y="${Y(s.data[last])-8}" text-anchor="end" class="k bold">${s.endLabel}</text>`});
  notes.forEach(nt=>{const x=X(nt.i);o+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ih}" stroke="${C.gray}" stroke-dasharray="2 3"/><text x="${x+4}" y="${m.t+(nt.dy||10)}" style="fill:${C.ink2}">${nt.text}</text>`});
  return o+'</svg>'}
function colsSVG({w,h,items,yMax,ticks=4,fmt=v=>pc(v,0),lab=v=>pc(v,1),whisker=false,m0}){
  const m=m0||{l:38,r:8,t:16,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/items.length,bw=Math.min(40,band*.58),Y=v=>m.t+ih-v/yMax*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt);
  items.forEach((it,i)=>{const cx=m.l+band*(i+.5),y=Y(it.v),x=cx-bw/2,r=Math.min(3,bw/2);
    if(Y(0)-y>.5)o+=`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${it.color||C.blue}"/>`;
    if(whisker&&it.lo!=null){const a=Y(it.lo),b=Y(it.hi);o+=`<line x1="${cx}" x2="${cx}" y1="${a}" y2="${b}" stroke="${C.ink}" stroke-width="1.4"/><line x1="${cx-4}" x2="${cx+4}" y1="${a}" y2="${a}" stroke="${C.ink}" stroke-width="1.4"/><line x1="${cx-4}" x2="${cx+4}" y1="${b}" y2="${b}" stroke="${C.ink}" stroke-width="1.4"/>`}
    o+=`<text x="${cx}" y="${(whisker&&it.hi!=null?Y(it.hi):y)-5}" text-anchor="middle" class="k bold">${lab(it.v,it)}</text><text x="${cx}" y="${h-(it.label2?18:7)}" text-anchor="middle">${it.label}</text>${it.label2?`<text x="${cx}" y="${h-6}" text-anchor="middle" style="fill:${C.gray}">${it.label2}</text>`:''}`});
  return o+'</svg>'}
function groupSVG({w,h,groups,yMax,ticks=4,fmt=v=>pc(v,0),lab=v=>pc(v,0),refs=[]}){
  const m={l:38,r:refs.length?78:8,t:16,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/groups.length,Y=v=>m.t+ih-v/yMax*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,ticks,fmt);
  groups.forEach((g,i)=>{const nn=g.vals.length,bw=Math.min(30,band*.72/nn),gap=2,tw=nn*bw+(nn-1)*gap,x0=m.l+band*(i+.5)-tw/2;
    g.vals.forEach((it,j)=>{if(it.v==null)return;const x=x0+j*(bw+gap),y=Y(it.v),r=Math.min(3,bw/2);
      o+=`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${it.color}"/><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" class="k" style="font-size:9.5px">${lab(it.v)}</text>`});
    o+=`<text x="${m.l+band*(i+.5)}" y="${h-7}" text-anchor="middle">${g.label}</text>`});
  refs.forEach(r=>{const y=Y(r.y);o+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${w-m.r+4}" y="${y+3.5}" style="fill:${r.color};font-weight:600">${r.label}</text>`});
  return o+'</svg>'}
function hbarsSVG({w,h,items,max,fmt=v=>pc(v,1),labelW=96,median,rowGap=.28,valW=48,thumb}){
  const pt=median?14:0;h=h-pt;const rh=h/items.length,bh=Math.max(5,rh*(1-rowGap)),iw=w-labelW-valW;let o=`<svg width="${w}" height="${h+pt}" viewBox="0 0 ${w} ${h+pt}">`;
  const mx=max||Math.max(...items.map(i=>i.v));
  if(median!=null){const x=labelW+median.v/mx*iw;o+=`<line x1="${x}" x2="${x}" y1="9" y2="${h+pt}" stroke="${C.ink}" stroke-width="1.3" stroke-dasharray="4 3"/><text x="${x}" y="7" text-anchor="middle" class="k bold" style="font-size:9.5px">${median.label}</text>`}
  items.forEach((it,i)=>{const y=pt+i*rh+(rh-bh)/2,bw=Math.max(1,it.v/mx*iw);
    o+=`<text x="${labelW-6}" y="${y+bh/2+3.5}" text-anchor="end" ${it.bold?'class="k bold"':''}>${it.label}</text><rect x="${labelW}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="${it.color||C.blue}"/><text x="${labelW+bw+5}" y="${y+bh/2+3.5}" class="k" style="font-size:${rh<14?9:10}px">${it.lab||fmt(it.v)}</text>`});
  if(thumb)o+=`<rect x="${w-5}" y="${pt}" width="4" height="${h}" rx="2" fill="#eceae3"/><rect x="${w-5}" y="${pt+thumb.top}" width="4" height="${thumb.h}" rx="2" fill="#b8b6ac"/>`;
  return o+'</svg>'}
function stackSVG({w,h,parts,fmt=v=>pc(v,1)}){const tot=parts.reduce((a,p)=>a+p.v,0);let x=0,o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  parts.forEach(p=>{const pw=p.v/tot*w,bw=Math.max(0,pw-2);o+=`<rect x="${x}" y="0" width="${bw}" height="${h}" rx="3" fill="${p.color}"/>`;
    if(bw>46)o+=`<text x="${x+7}" y="${h/2+4}" style="fill:${p.text||'#fff'};font-weight:600;font-size:11px">${p.lab||fmt(p.v/tot)}</text>`;x+=pw});return o+'</svg>'}
function gaugeSVG({w,h,value,min,max,target,baseline,fmtv}){
  const cx=w/2,cy=h-34,r=Math.min(w/2-34,h-70),th=24,ang=v=>Math.PI-(v-min)/(max-min)*Math.PI,pt=(v,rr)=>[cx+rr*Math.cos(ang(v)),cy-rr*Math.sin(ang(v))];
  const arc=(v0,v1,rr)=>{const a=pt(v0,rr),b=pt(v1,rr);return `M${a[0]} ${a[1]}A${rr} ${rr} 0 0 1 ${b[0]} ${b[1]}`};
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${arc(min,max,r)}" fill="none" stroke="#e8e6df" stroke-width="${th}"/><path d="${arc(min,value,r)}" fill="none" stroke="${C.orange}" stroke-width="${th}"/>`;
  [[target,C.blue,'Meta'],[baseline,C.dark,'Baseline']].forEach(([v,c,t])=>{const a=pt(v,r-th/2-4),b=pt(v,r+th/2+6),l=pt(v,r+th/2+18);o+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="2.4"/><text x="${l[0]}" y="${l[1]+3}" text-anchor="${v<value?'end':'start'}" style="fill:${c};font-weight:600;font-size:10.5px">${t} ${fmtv(v)}</text>`});
  o+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" style="font-size:36px;font-weight:650;fill:${C.ink}">${fmtv(value)}</text><text x="${cx-r}" y="${cy+18}" text-anchor="middle">${fmtv(min)}</text><text x="${cx+r}" y="${cy+18}" text-anchor="middle">${fmtv(max)}</text>`;
  return o+'</svg>'}
function comboSVG({w,h,items,yMax,y2Max=1}){
  const m={l:38,r:40,t:16,b:30},iw=w-m.l-m.r,ih=h-m.t-m.b,band=iw/items.length,bw=Math.min(38,band*.6),Y=v=>m.t+ih-v/yMax*ih,Y2=v=>m.t+ih-v/y2Max*ih;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+grid(w,h,m,yMax,4,v=>nf(v,0));
  for(let k=0;k<=4;k++)o+=`<text x="${w-m.r+6}" y="${Y2(y2Max*k/4)+3.5}">${pc(k/4*y2Max,0)}</text>`;
  let d='';items.forEach((it,i)=>{const cx=m.l+band*(i+.5),y=Y(it.v),x=cx-bw/2,r=3;
    o+=`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z" fill="${C.orange}"/><text x="${cx}" y="${y-5}" text-anchor="middle" class="k bold" style="font-size:9.5px">${nf(it.v,1)}</text>`;
    o+=`<text x="${cx}" y="${h-16}" text-anchor="middle" class="k bold">${it.cod}</text><text x="${cx}" y="${h-5}" text-anchor="middle" style="font-size:9px">${it.nome}</text>`;d+=(i?'L':'M')+cx+' '+Y2(it.cum)});
  o+=`<path d="${d}" fill="none" stroke="${C.dark}" stroke-width="2"/>`;items.forEach((it,i)=>{const cx=m.l+band*(i+.5);o+=`<circle cx="${cx}" cy="${Y2(it.cum)}" r="3" fill="${C.dark}" stroke="#fff" stroke-width="1.2"/>`;if(i===2||i===items.length-1||i===0)o+=`<text x="${cx+(i===0?22:0)}" y="${Y2(it.cum)-7}" text-anchor="middle" class="k bold" style="font-size:9.5px;paint-order:stroke;stroke:#fff;stroke-width:3px">${pc(it.cum,0)}</text>`});
  return o+'</svg>'}
function sparkSVG(vals,color,w=76,h=26){const v=vals.filter(x=>x!=null);if(v.length<2)return'';const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;const X=i=>2+i*(w-6)/(vals.length-1),Y=x=>h-3-(x-mn)/r*(h-8);let d='',op=false,last=0;vals.forEach((x,i)=>{if(x==null){op=false;return}d+=(op?'L':'M')+X(i)+' '+Y(x);op=true;last=i});return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${X(last)}" cy="${Y(vals[last])}" r="2.8" fill="${color}"/></svg>`}
const legend=(it)=>`<div class="legend">${it.map(i=>`<span><i class="${i.sq?'sq':''}" style="background:${i.c}"></i>${i.t}</span>`).join('')}</div>`;

/* ============ moldura de visual ============ */
function V(id,x,y,w,h,title,sub,body,opt={}){
  const sp=SPEC[id]||{},v11=sp.escopo==='v1.1';
  const bt=title?(sub?44:30):10, bw=w-24, bh=h-bt-8;
  const chip=sp.tipo?`<div class="chip"><b>${id}</b>${esc(sp.tipo)} · ${esc(sp.medidas)}</div>`:'';
  const inner=typeof body==='function'?body(bw,bh):body;
  return `<div class="v${v11?' v11':''}" data-id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${chip}${v11?'<span class="tag11">v1.1 · em breve</span>':''}${title?`<div class="t">${title}</div>`:''}${sub?`<div class="s">${sub}</div>`:''}<div class="b" style="top:${bt}px;${opt.pad?'':''}">${inner}</div></div>`}
function K(id,x,y,w,h,label,value,sub,sub2,opt={}){
  const sp=SPEC[id]||{};const chip=sp.tipo?`<div class="chip"><b>${id}</b>${esc(sp.tipo)} · ${esc(sp.medidas)}</div>`:'';
  return `<div class="v kpi" data-id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${chip}<div class="lab">${label}</div><div class="val" style="color:${opt.color||C.ink}">${value}</div>${opt.spark?`<div class="sp">${opt.spark}</div>`:''}<div class="sub">${sub||''}</div><div class="sub2">${sub2||''}</div></div>`}
