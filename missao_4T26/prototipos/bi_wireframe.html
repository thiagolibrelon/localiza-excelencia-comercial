function lineChart(host, {labels, series, yFmt=pct, yMax, yMin=0, height=220, refLines=[], ariaLabel, ticks=4}) {

      const med=D.mediana_carteira.k1; svg.append(s('line',{x1:X(med),x2:X(med),y1:m.t,y2:H-m.b,stroke:c.ink,'stroke-width':1.5})); svg.append(s('text',{x:X(med)+4,y:m.t+10,class:'t-ink'},'mediana '+pct(med)));
      dist.forEach((d,i)=>{ const y=m.t+i*rowH+rowH/2; svg.append(s('text',{x:m.l-8,y:y+4,'text-anchor':'end',class:'t-ink'},d)); svg.append(s('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,class:'axis'}));
        const cs=D.carteiras.filter(x=>x.dist===d).sort((a,b)=>a.k1-b.k1); cs.forEach((x,j)=>{ const dy=((j%3)-1)*9; const on=(!fd||fd===d)&&(!fc||fc===x.c), sel=fc===x.c;

      sb.append(svg); }); };
  P.carteiras.redraw=draw; draw();
  g.append(card('c8','Carga operacional por carteira','Cada ponto é uma carteira com 40+ ligações classificadas. Compare com a mediana, não entre pessoas.',sb,{head:['Carteira','Distrital','Carga','Negociação','Problema','Ligações'],body:[...D.carteiras].sort((a,b)=>b.k1-a.k1).map(x=>[x.c,x.dist,pct(x.k1),pct(x.k7),pct(x.prob),num(x.n)])}));

    const skills=[['SPIN · Situação','spin_s',5],['SPIN · Problema','spin_p',5],['SPIN · Implicação','spin_i',5],['SPIN · Necessidade','spin_n',5],['Challenger · dado concreto','dado',1],['Challenger · conecta à situação','conecta',1],['Challenger · cliente reage','reage',1],['Chegou ao decisor','decisor',1]];
    skills.forEach(([lab,k,mx])=>{ const v=car?car[k]:med[k], m=med[k], fm=mx===5?(x=>num(x,2)):(x=>pct(x));
      const tr=h('div',{class:'bar-track',style:'position:relative'}); const w=Math.min(100,v/mx*100), mp=Math.min(100,m/mx*100);
      tr.append(h('div',{style:`position:absolute;left:0;top:0;bottom:0;width:${w}%;background:var(--s1);border-radius:5px`}),h('div',{style:`position:absolute;left:${mp}%;top:-4px;bottom:-4px;width:2px;background:var(--ink)`,title:'mediana'}));
      body.append(h('div',{class:'skill'},[h('span',{},lab),tr,h('span',{class:'v'},fm(v))])); });
    body.append(h('div',{class:'sub'},'Barra = valor da carteira · risco preto = mediana. SPIN em nota de 1 a 5; demais em % das ligações.')); };
  P.comp.redraw=draw; draw();
  g.append(card('c7','Mapa de competências',' ',h('div',{},[info,body])));
  const lad=h('div'); colChart(lad,{items:[{label:'Dado',v:C.dado},{label:'Conecta',v:C.conecta},{label:'Reação',v:C.reage},{label:'Completo',v:C.ch_completo}],height:200,yMax:0.4,ariaLabel:'Escada do Challenger'});
  g.append(card('c5','Escada do Challenger','Traz dado → conecta à situação → cliente reage. Challenger completo em 9,1% das ligações.',lad,{head:['Degrau','% das ligações'],body:[['Trouxe dado',pct(C.dado)],['Conectou à situação',pct(C.conecta)],['Cliente reagiu',pct(C.reage)],['Challenger completo',pct(C.ch_completo)]]}));
  const spinItems=Object.entries(C.spin).map(([k,v])=>({label:k,v:v.nota1})); const sp=h('div'); colChart(sp,{items:spinItems,height:200,yMax:0.6,ticks:6,highlight:x=>x.label==='Implicação',tipFn:x=>`<b>${x.label}</b><br>${pct(x.v)} das ligações com nota 1 · média ${num(C.spin[x.label].media,2)}`,ariaLabel:'SPIN: participação da nota 1'});

  const co=h('div',{},[h('div',{class:'badge'},'Sugestão de 1:1 · rascunho para o Treinamento'),
    h('div',{class:'excerpt'},[h('p',{},[h('b',{},'Problema: '),'[Cliente] mencionou dificuldades com o sistema de reservas online.']),h('p',{},[h('b',{},'Implicação (nota 4): '),'o agente destacou que, na alta temporada, os preços podem subir e que reservar tarde custa mais.']),h('p',{},[h('b',{},'Necessidade: '),'sugeriu reservar com antecedência para garantir preço melhor.'])]),
    h('div',{class:'sub'},'Use um exemplo de Implicação bem feita e peça ao vendedor que refaça a pergunta numa ligação sua. Texto resumido pela análise SPIN, nomes mascarados.')]);

  g.append(card('c6','Colunas por uso recomendado','Ver anexos/dicionario_dados_setembro.csv. Colunas “não usar”: duplicadas, constantes ou 95%+ de sentinela.',ct));
