<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --line:#2c2c2a; --axis:#383835;
  --brand:#3987e5; --brand-ink:#0b0b0b; --brand-wash:#14283f; --accent:#d95926; --ok:#4cc24c; --ok-wash:#12301a; --bad:#ff8585; --bad-wash:#3a1717; --mark:#5a4a10; --track:#2c2c2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --line:#2c2c2a; --axis:#383835;

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:16px/1.5 var(--font);margin:0;padding-inline:16px;padding-block:0 56px}
.app{max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--page);z-index:5;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em}
.stats{display:flex;gap:14px;font-size:14px;color:var(--ink2);align-items:center}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
h1{font-size:24px;line-height:1.2;margin:20px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--ink2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;min-width:0}
button,select{font:inherit;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:650;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{display:flex;width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{min-height:44px;border:1px solid var(--axis);border-radius:10px;background:var(--surface);padding:0 10px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pill{display:inline-block;font-size:12px;border:1px solid var(--axis);border-radius:999px;padding:1px 10px;color:var(--ink2)}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:5px}
.path{display:flex;flex-direction:column;gap:0;margin:8px 0}
.node{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.node:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:-2px;width:2px;background:var(--line)}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--brand);color:var(--brand);background:var(--surface)}
.dot.done{background:var(--brand);color:var(--brand-ink)}
.dot.lock{border-color:var(--axis);color:var(--muted)}
.node .body{min-width:0}
.node h3{margin:0;font-size:16px}
.node .meta{font-size:13px;color:var(--ink2);margin:2px 0 8px}
.skillrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.skillrow .v{text-align:right;font-variant-numeric:tabular-nums}
.track2{position:relative;height:10px;border-radius:5px;background:var(--track)}
.track2 i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--brand)}
.track2 u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.excerpt{border-left:4px solid var(--axis);padding:6px 0 6px 14px;margin:12px 0;font-size:16px}
.excerpt p{margin:6px 0}
.excerpt .who{font-weight:650;color:var(--ink2);margin-right:6px}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer;background:var(--surface);min-height:52px}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--brand)}
.opt:hover{border-color:var(--axis)}
.opt.sel{border-color:var(--brand);background:var(--brand-wash)}
.opt.right{border-color:var(--ok);background:var(--ok-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.fb{border-radius:12px;padding:12px 14px;margin:14px 0}
.fb.ok{background:var(--ok-wash);border:1px solid var(--ok)}
.fb.no{background:var(--bad-wash);border:1px solid var(--bad)}
.fb h3{margin:0 0 4px;font-size:16px}
.src{font-size:13px;color:var(--ink2);margin-top:10px}
.src code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--line);padding:1px 5px;border-radius:4px}
.draft{font-size:13px;color:var(--ink2);border:1px dashed var(--axis);border-radius:10px;padding:10px 12px;margin:16px 0}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.xp{animation:pop .5s ease-out both}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.xp{animation:none}}
.close{background:none;border:0;color:var(--ink2);font-size:14px;cursor:pointer;min-height:40px;padding:0 6px}
.note{font-size:13px;color:var(--ink2)}
</style>

  const ladder = {dado:'Trazer dado',conecta:'Conectar à situação',reage:'Provocar reação'}; const lk = Object.keys(ladder).reduce((a,b)=>v[a]<v[b]?a:b);
  const rel = {T1:(v.spin_i-med.spin_i)/med.spin_i, T2:(Math.min(v.dado,v.conecta,v.reage)-Math.min(med.dado,med.conecta,med.reage))/Math.min(med.dado,med.conecta,med.reage)}; // só trilhas com lições
  const worst = Object.entries(rel).sort((a,b)=>a[1]-b[1])[0][0];
  return {v, t1k, lk:ladder[lk], rel, worst};
}
/* ---------- estado de tela ---------- */
const S = {view:'home', lic:null, step:0, sel:null, checked:false, acertos:0, carteira:''};
const app = $('#app');
const trilhaDe = id => TRILHAS.find(t=>t.id===id);
const licDe = id => LICOES.filter(l=>l.t===id);
function topbar() { const sk=streak(); return h('div',{class:'top'},[h('div',{class:'brand'},'Trilha do Vendedor'),h('div',{class:'stats','aria-label':'Seu progresso'},[h('span',{},['Sequência ',h('b',{},String(sk)+' d')]),h('span',{},['XP ',h('b',{},String(store.xp))])])]); }
function skillRow(label, v, m, max, fmt) { const w=Math.min(100,v/max*100), mp=Math.min(100,m/max*100); const tr=h('div',{class:'track2'},[h('i',{style:`width:${w}%`}),h('u',{style:`left:${mp}%`,title:'mediana'})]); return h('div',{class:'skillrow'},[h('div',{},[h('div',{},label),tr]),h('div',{class:'v'},fmt(v))]); }

/* ---------- home ---------- */
function home() {

    skillRow('SPIN · Implicação (nota 1–5)',v.spin_i,med.spin_i,5,x=>num(x)),

    skillRow('Challenger · conecta à situação',v.conecta,med.conecta,0.5,pct),

    h('p',{class:'note'},'Barra = sua carteira · risco preto = mediana das carteiras. Dados de 01–22/09.'),
    h('div',{class:'fb ok',style:'margin-bottom:0'},[h('h3',{},'Recomendado agora: '+worstT.id+' · '+worstT.nome),h('div',{style:'margin-bottom:10px'},c?`Na carteira ${c.c}, entre as trilhas com lições, a mais distante da mediana é “${worstT.nome}”.`:'Sem carteira selecionada, mostra a trilha com mais espaço para melhorar na mediana.'),h('button',{class:'btn',style:'min-height:40px;padding:0 14px',onclick:()=>start(licDe(worstT.id).find(l=>!store.done[l.id])?.id||licDe(worstT.id)[0].id)},'Começar '+worstT.id)])]);

    const body=h('div',{class:'body'},[h('h3',{},t.nome),h('div',{class:'meta'},t.sub),

/* ---------- lição ---------- */
function start(id) { S.view='lic'; S.lic=LICOES.find(l=>l.id===id); S.sel=null; S.checked=false; S.opts=null; scrollTo(0,0); lesson(); }
function ctx(l) { const box=h('div',{});
  if(l.contexto) box.append(h('p',{class:'note',style:'margin:4px 0 8px'},l.contexto));
  if(l.turnos){ const ex=h('div',{class:'excerpt',role:'group','aria-label':'Trecho real da ligação, mascarado'}); l.turnos.forEach(([w,tx])=>{ const p=h('p',{}); p.append(h('span',{class:'who'},w==='A'?'Vendedor':'Cliente')); const parts=tx.split(/\{\{|\}\}/); parts.forEach((s,i)=>{ if(!s) return; p.append(i%2?h('mark',{},s):document.createTextNode(s)); }); ex.append(p); }); box.append(ex); }
  return box; }
function lesson() {
  const l=S.lic, T=trilhaDe(l.t), idx=licDe(l.t).indexOf(l)+1, n=licDe(l.t).length;
  app.replaceChildren(h('div',{class:'top'},[h('button',{class:'close',onclick:()=>{S.view='home';home();},'aria-label':'Voltar às trilhas'},'← Trilhas'),h('div',{class:'stats'},[h('span',{},[T.id+' · lição ',h('b',{},`${idx}/${n}`)])])]));
  app.append(h('div',{class:'bar',style:'margin:14px 0 6px'},h('i',{style:`width:${(idx-1)/n*100+(S.checked?100/n:0)}%`})));
  app.append(h('h1',{style:'font-size:22px'},l.titulo));
  const card=h('div',{class:'card'}); card.append(ctx(l)); app.append(card);
  let optsEl;
  if(l.tipo==='spin'){
    const raw=[{k:'P',t:l.itens.P,ok:false,fb:'Esta frase descreve o Problema: o que o cliente relatou. A Implicação é a consequência dele.'},{k:'I',t:l.itens.I,ok:true,fb:'Esta é a Implicação: mostra o que o problema causa em custo, prazo ou risco.'},{k:'N',t:l.itens.N,ok:false,fb:'Esta frase descreve a Necessidade de solução: o valor de resolver. A Implicação vem antes dela.'}];
    S.opts=S.opts||shuffle(raw,l.id); optsEl=options(S.opts,'Qual frase descreve a Implicação do problema?');
  } else if(l.tipo==='tecnica'){
    const raw=l.opcoes.map(c=>({t:c+' · '+CH[c],ok:c===l.codigo,fb:c===l.codigo?'':'Esta é outra técnica: '+CH[c]+' ('+c+'). Compare com a parte destacada.'}));
    S.opts=S.opts||shuffle(raw,l.id); optsEl=options(S.opts,'Qual técnica Challenger o vendedor usa na parte destacada?');
  } else { S.opts=S.opts||shuffle(l.opcoes,l.id); optsEl=options(S.opts,l.pergunta); }
  app.append(optsEl);
  const act=h('div',{id:'act'}); app.append(act); renderAct();
}
function options(opts,q) { const fs=h('fieldset',{style:'border:0;padding:0;margin:0;min-width:0'},[h('legend',{style:'font-weight:650;margin:12px 0 4px;padding:0'},q)]);
  opts.forEach((o,i)=>{ const id='o'+i; const inp=h('input',{type:'radio',name:'opt',id,value:String(i),disabled:S.checked}); if(S.sel===i) inp.checked=true;
    const lab=h('label',{class:'opt'+(S.checked?(o.ok?' right':(S.sel===i?' wrong':'')):(S.sel===i?' sel':'')),for:id},[inp,h('span',{},o.t)]);
    inp.addEventListener('change',()=>{ S.sel=i; document.querySelectorAll('.opt').forEach((x,j)=>x.classList.toggle('sel',j===i)); renderAct(); }); fs.append(lab); }); return fs; }
function renderAct() { const l=S.lic, act=$('#act'); act.replaceChildren();
  if(!S.checked){ act.append(h('button',{class:'btn block',disabled:S.sel==null,onclick:check},'Verificar')); return; }

  const okFlag=o.ok;
  act.append(h('div',{class:'fb '+(okFlag?'ok':'no'),role:'status'},[h('h3',{},okFlag?'Correto':'Ainda não'),h('div',{},okFlag?(o.fb||'Isso mesmo.'):o.fb),!okFlag?h('div',{style:'margin-top:6px'},[h('b',{},'Resposta: '),right.t]):null,
    l.tipo==='tecnica'&&l.reacao?h('div',{style:'margin-top:6px'},['Reação do cliente no CSV: “'+l.reacao+'”.']):null,
    h('div',{class:'src'},['Origem no CSV: ',...l.fonte.flatMap((f,i)=>[i?', ':'',h('code',{},f)]),'. ',l.tipo==='tecnica'?`O código ${l.codigo} é o rótulo do classificador.`:'',l.autoral?' Pergunta e opções escritas para o protótipo.':''])]));
  act.append(h('div',{class:'card'},[h('b',{},'Para a próxima ligação: '),l.alvo,h('div',{class:'note',style:'margin-top:6px'},'Como medimos: '+l.medida)]));
  const list=licDe(l.t), i=list.indexOf(l), last=i===list.length-1;
  act.append(h('button',{class:'btn block',onclick:()=>{ if(last) finish(); else start(list[i+1].id); }},last?'Concluir trilha':'Próxima lição'));
}
function check() { const l=S.lic, o=S.opts[S.sel]; S.checked=true; if(o.ok){ S.acertos++; }
  if(!store.done[l.id]){ store.done[l.id]=true; store.xp+= o.ok?10:5; const k=new Date().toISOString().slice(0,10); if(!store.days.includes(k)) store.days.push(k); save(); }
  lesson(); }
function finish() { const l=S.lic, T=trilhaDe(l.t), list=licDe(l.t), feitas=list.filter(x=>store.done[x.id]).length;
  app.replaceChildren(topbar());
  app.append(h('h1',{},T.nome+' · trilha concluída'),h('div',{class:'card'},[h('div',{class:'big xp'},'+'+(list.length*10)+' XP'),h('p',{class:'lead',style:'margin-top:8px'},`${feitas} de ${list.length} lições feitas. XP total: ${store.xp}.`),
    h('p',{},'Em produção, o próximo passo seria uma missão de comportamento (ex.: trazer 1 dado concreto em 3 ligações), verificada nas colunas do CSV 14 dias depois.')]),
    h('button',{class:'btn block',onclick:()=>{S.view='home';home();}},'Voltar às trilhas')); scrollTo(0,0); }
home();
